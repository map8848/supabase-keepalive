name: Supabase保活
on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch: # 手动运行开关

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 访问数据库保活
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl \
            --retry 3 \
            --retry-delay 5 \
            --connect-timeout 15 \
            -s \
            "$URL/rest/v1/" \
            -H "apikey: $KEY"
