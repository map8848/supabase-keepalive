name: Supabase保活
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: # 手动运行开关，加上后页面会出现Run按钮
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 访问数据库保活
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl "$URL/rest/v1/?apikey=$KEY"
